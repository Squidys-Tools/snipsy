[package]
name = "snipsy"
version = "0.1.0"
edition = "2021"
description = "A CleanShot-style screenshot tool for Windows built with Rust + GPUI"

[dependencies]
gpui = "0.2.2"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiny-skia = "0.11"
ab_glyph = "0.2"
global-hotkey = "0.7"
tray-icon = "0.21"
arboard = { version = "3", features = ["image-data"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
raw-window-handle = "0.6"
smallvec = "1"
flume = "0.11"
lyon = "1"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Memory",
  "Win32_System_DataExchange",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_UI_Shell_Common",
  "Win32_Media_Audio",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
